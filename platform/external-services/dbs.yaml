# ── Quick connectivity test: kubectl -n databases logs job/db-check ─────────
apiVersion: batch/v1
kind: Job
metadata:
  name: db-check
  namespace: databases
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: pg
          image: postgres:17-alpine
          envFrom: [{ secretRef: { name: db-credentials } }]
          command: ["sh", "-c"]
          args:
            - |
              echo "primary:";  psql "$DATABASE_URL" -tAc "select inet_server_addr(), pg_is_in_recovery()";
              echo "replica:";  psql "postgresql://$PG_USER:$PG_PASSWORD@pg-ro.databases.svc.cluster.local:5432/$PG_DATABASE" -tAc "select inet_server_addr(), pg_is_in_recovery()";
              echo "pgvector:"; psql "$DATABASE_URL" -tAc "select extversion from pg_extension where extname='vector'"
        - name: redis
          image: redis:8-alpine
          envFrom: [{ secretRef: { name: db-credentials } }]
          command: ["sh", "-c"]
          args:
            - |
              redis-cli -u "$REDIS_URL" --no-auth-warning ping;
              redis-cli -u "$REDIS_URL" --no-auth-warning info replication | head -3;
              echo "sentinel says master is:";
              redis-cli -h redis-sentinel-1.databases.svc.cluster.local -p 26379 -a "$REDIS_SENTINEL_PASSWORD" --no-auth-warning sentinel get-master-addr-by-name mymaster | paste -sd' ';
              M=$(redis-cli -h redis-sentinel-2.databases.svc.cluster.local -p 26379 -a "$REDIS_SENTINEL_PASSWORD" --no-auth-warning sentinel get-master-addr-by-name mymaster | paste -sd' ');
              echo "connecting to that address directly:"; redis-cli -h ${M% *} -p ${M#* } -a "$REDIS_PASSWORD" --no-auth-warning role | head -1