# ─────────────────────────────────────────────────────────────────────────────
#  Expose the Docker-hosted pg-ha and redis-ha clusters inside Kubernetes
#  as normal in-cluster Services (no proxies, no operators).
#
#  BEFORE APPLYING: replace every 72.62.152.181 with the IP of the Docker host
#  running pg-ha / redis-ha (its LAN or Tailscale IP), and fill in passwords.
#
#  Apps then connect to:
#    pg-rw.databases.svc.cluster.local:5432      → Postgres primary (read/write)
#    pg-ro.databases.svc.cluster.local:5432      → Postgres replicas (read-only)
#    pg-pooler.databases.svc.cluster.local:5432  → PgBouncer (db appdb / appdb_ro)
#    redis.databases.svc.cluster.local:6379      → Redis master (read/write)
#    redis-ro.databases.svc.cluster.local:6379   → Redis replicas (read-only)
#    redis-sentinel-{1,2,3}.databases.svc.cluster.local:26379
#                                                → Sentinels (master name: mymaster)
#  Sentinel needs ANNOUNCE_IP set in redis-ha (see redis-ha compose header):
#  Sentinel hands clients the master as ANNOUNCE_IP:7001-7003, so pods must be
#  able to reach that IP on ports 7001-7003 directly.
# ─────────────────────────────────────────────────────────────────────────────
# ── Postgres primary (pg-ha HAProxy :5000) ──────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: pg-rw
  namespace: databases
spec:
  ports:
    - name: postgres
      port: 5432
      targetPort: 5000
      protocol: TCP
---
# ── Postgres replicas (pg-ha HAProxy :5001) ─────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: pg-ro
  namespace: databases
spec:
  ports:
    - name: postgres
      port: 5432
      targetPort: 5001
      protocol: TCP
---
# ── PgBouncer pooler (pg-ha :6432) ──────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: pg-pooler
  namespace: databases
spec:
  ports:
    - name: postgres
      port: 5432
      targetPort: 6432
      protocol: TCP
---
# ── Redis master (redis-ha HAProxy :6379) ───────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: databases
spec:
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
---
# ── Redis replicas (redis-ha HAProxy :6380) ─────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: redis-ro
  namespace: databases
spec:
  ports:
    - name: redis
      port: 6379
      targetPort: 6380
      protocol: TCP
---
# ── Redis Sentinel 1 (redis-ha :26379) ──
apiVersion: v1
kind: Service
metadata:
  name: redis-sentinel-1
  namespace: databases
spec:
  ports:
    - name: sentinel
      port: 26379
      targetPort: 26379
      protocol: TCP
---
# ── Redis Sentinel 2 (redis-ha :26380) ──
apiVersion: v1
kind: Service
metadata:
  name: redis-sentinel-2
  namespace: databases
spec:
  ports:
    - name: sentinel
      port: 26379
      targetPort: 26380
      protocol: TCP
---
# ── Redis Sentinel 3 (redis-ha :26381) ──
apiVersion: v1
kind: Service
metadata:
  name: redis-sentinel-3
  namespace: databases
spec:
  ports:
    - name: sentinel
      port: 26379
      targetPort: 26381
      protocol: TCP