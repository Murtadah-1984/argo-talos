apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: image-factory
  namespace: argo-wf
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: image-factory
  namespace: argo-wf
subjects:
  - kind: ServiceAccount
    name: image-factory
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: image-factory