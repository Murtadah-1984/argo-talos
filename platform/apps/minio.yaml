apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  sources:
    - repoURL: oci://registry-1.docker.io/cloudpirates
      chart: minio
      targetRevision: 0.14.0
      helm:
        releaseName: minio
        valueFiles:
          - $values/platform/minio/values.yaml
    - repoURL: https://github.com/Murtadah-1984/argo-talos.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: minio
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
