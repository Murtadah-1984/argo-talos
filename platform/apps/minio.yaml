apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  # Chart is vendored under platform/minio/chart so Argo CD does not pull
  # oci://registry-1.docker.io/cloudpirates (Docker Hub returns 401 anonymously).
  source:
    repoURL: https://github.com/Murtadah-1984/argo-talos.git
    targetRevision: main
    path: platform/minio/chart
    helm:
      releaseName: minio
      valueFiles:
        - ../values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: minio
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
