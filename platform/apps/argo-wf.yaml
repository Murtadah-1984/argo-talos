apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-workflows
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-workflows
      targetRevision: 2.0.13
      helm:
        releaseName: argo-workflows
        valueFiles:
          - $values/platform/argo-wf/values.yaml
    - repoURL: https://github.com/Murtadah-1984/argo-talos.git
      targetRevision: main
      path: platform/argo-wf
    - repoURL: https://github.com/Murtadah-1984/argo-talos.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-wf
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
