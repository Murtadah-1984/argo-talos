apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-workflows
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: "https://argoproj.github.io/argo-helm"
      chart: argo-workflows
      targetRevision: "2.0.13"
      helm:
        valueFiles:
          - $values/platform/argo-wf/values.yaml
    - repoURL: https://github.com/Murtadah-1984/k8sgitops.git
      path: platform/argo-wf
      targetRevision: main
    - repoURL: https://github.com/Murtadah-1984/argo-talos.git
      targetRevision: main
      ref: values
  destination:
    namespace: argo-wf
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true