# MetalLB will answer ARP for every address below. Use a range that is
# free on the cluster LAN and outside DHCP before you push this file.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: default
  namespace: metallb
spec:
  autoAssign: true
  addresses:
    - 192.172.0.0/24
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: default
  namespace: metallb
spec:
  ipAddressPools:
    - default
