apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: workloads
  namespace: argocd
spec:
  description: Applications you deploy on top of the platform.
  # Add a Helm repo URL here before an Application in this project can use it.
  sourceRepos:
    - https://github.com/Murtadah-1984/argo-talos.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
