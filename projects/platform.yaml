apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Cluster services that the rest of the cluster depends on.
  sourceRepos:
    - https://github.com/Murtadah-1984/argo-talos.git
    - https://charts.jetstack.io
    - https://kubernetes.github.io/ingress-nginx
    - https://metallb.github.io/metallb
    - https://kubernetes-sigs.github.io/metrics-server/
    - https://github.com/rancher/local-path-provisioner.git
    - https://bitnami.github.io/sealed-secrets
    - http://charts.gitlab.io/
    - https://seaweedfs.github.io/seaweedfs/helm
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
